
name: Auto Unzip ZIP Files

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and remove ZIP files
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import zipfile
          from pathlib import Path

          for archive in Path(".").rglob("*.zip"):
              if ".git" in archive.parts:
                  continue

              destination = archive.with_suffix("")
              destination.mkdir(parents=True, exist_ok=True)

              with zipfile.ZipFile(archive) as z:
                  for info in z.infolist():
                      target = (destination / info.filename).resolve()

                      if not target.is_relative_to(destination.resolve()):
                          raise ValueError(
                              f"Unsafe ZIP path: {info.filename}"
                          )

                  z.extractall(destination)

              archive.unlink()
              print(f"Extracted and removed: {archive}")

          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Auto extract ZIP files"
            git push
          fi
